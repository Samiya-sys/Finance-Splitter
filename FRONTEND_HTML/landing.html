<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Finance Splitter — Landing</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body class="bg">
  <div class="container">
    <div class="card neon-card">
      <h1 class="title">Finance Splitter</h1>
      <p class="subtitle">Split expenses, visualize spends, and settle with minimal transactions.</p>

      <div class="actions">
        <!-- Create Room -->
        <div class="create-room">
          <input id="createName" placeholder="Your Name"/>
          <button id="createBtn" class="btn">Create Room</button>
        </div>

        <!-- Join Room -->
        <div class="join">
          <input id="joinName" placeholder="Your Name"/>
          <input id="joinInput" placeholder="Enter Room ID"/>
          <button id="joinBtn" class="btn alt">Join Room</button>
        </div>
      </div>

      <p class="hint">Rooms are short UUIDs (8 chars). Share with friends to join.</p>
    </div>

    <div class="footer neon-footer">Cyberpunk Neumorphism Theme • Demo Project</div>
  </div>

<script>
document.getElementById('createBtn').onclick = async () => {
  const name = document.getElementById('createName').value.trim();
  if(!name)
  {
    alert("Please enter your name");
    return;
  }

  const formData = new FormData();
  formData.append("name", name);

  const res = await fetch('/create_room', {method:'POST', body: formData});
  const data = await res.json();
  window.location = '/join/' + data.room_id + '?name=' + encodeURIComponent(name);

};

document.getElementById('joinBtn').onclick = async () => {
  const name = document.getElementById('joinName').value.trim();
  const id = document.getElementById('joinInput').value.trim();

  if(!name || !id){
    alert("Please enter your name and room ID");
    return;
  }

  // Create a hidden form to submit POST to /join/<room_id>
  const form = document.createElement('form');
  form.method = 'POST';
  form.action = '/join/' + id;

  const inputName = document.createElement('input');
  inputName.type = 'hidden';
  inputName.name = 'name';
  inputName.value = name;

  form.appendChild(inputName);
  document.body.appendChild(form);
  form.submit();
};
</script>
</body>
</html>
